name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pr
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, client-navigation]
        engine: [Chromium, Firefox, WebKit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm build
      # Unlabelled tests exercise Chromium, and run once in its partition.
      - run: pnpm test:browser tests/${{ matrix.suite }}.test.ts --testNamePattern '${{ matrix.engine }}|${{ matrix.engine == 'Chromium' && '^(?!.*(?:Chromium|Firefox|WebKit)).*$' || '^$' }}'

  runtimes:
    name: Deno and Bun runtime
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the affected application packages in a consumer
        run: |
          mkdir -p "$RUNNER_TEMP/packs" "$RUNNER_TEMP/consumer"
          pnpm pack --pack-destination "$RUNNER_TEMP/packs"
          cd "$RUNNER_TEMP/consumer"
          echo '{"private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/packs/*.tgz
          cp "$GITHUB_WORKSPACE/scripts/runtime-smoke.mjs" .
      - working-directory: ${{ runner.temp }}/consumer
        # Node builds the application whose server entry Deno and Bun then run.
        run: node runtime-smoke.mjs && deno run -A runtime-smoke.mjs && bun runtime-smoke.mjs
